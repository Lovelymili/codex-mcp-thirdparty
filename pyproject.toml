[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-mcp-thirdparty"
version = "1.0.0"
description = "An independent MCP server connecting Claude Code to Codex CLI, with persistent sessions and runtime fallback."
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "Lovelymili"}]
dependencies = []
keywords = ["codex", "claude-code", "mcp", "model-context-protocol"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]

[project.scripts]
codex-mcp-thirdparty = "codex_mcp:entrypoint"

[project.urls]
Homepage = "https://github.com/Lovelymili/codex-mcp-thirdparty"
Repository = "https://github.com/Lovelymili/codex-mcp-thirdparty"
Issues = "https://github.com/Lovelymili/codex-mcp-thirdparty/issues"

[tool.setuptools]
py-modules = ["codex_mcp"]
